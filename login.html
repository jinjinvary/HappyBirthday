<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>너 누구야?</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="frameContainer">
      <img
        class="deco"
        id="deco1"
        src="assets/WormOnBush.svg"
        alt="수풀속지렁이"
      />
      <img
        src="assets/WormOnBushMoving.svg"
        alt="움직이는 지렁이"
        class="deco"
        id="deco8"
      />
      <img class="deco" id="deco2" src="assets/Heart.svg" alt="하트" />
      <img class="deco" id="deco3" src="assets/짱아.svg" alt="짱아" />
      <img
        class="deco"
        id="deco4"
        src="assets/WormOnBush.svg"
        alt="수풀속지렁이"
      />
      <img
        src="assets/WormOnBushMoving.svg"
        alt="움직이는 지렁이"
        class="deco"
        id="deco9"
      />
      <img class="deco" id="deco5" src="assets/짱구.svg" alt="짱구" />
      <img
        src="assets/Who are you.svg"
        alt="짱아대사"
        class="deco"
        id="deco6"
      />
      <img
        src="assets/신원을 밝혀라 오바 !.svg"
        alt="짱구대사"
        class="deco"
        id="deco7"
      />
      <div class="frame">
        <div class="layer">
          <div class="title">너 누구야?!</div>
          <form id="loginForm">
            <input type="text" placeholder="이름" id="name" autocomplete="off" required />
            <input type="password" placeholder="생년월일(ex.000530)" id="birth" inputmode="numeric" required />
            <button type="submit" class="check">확인</button>
            <p id="message" role="status"></p>
          </form>
        </div>
      </div>
    </div>
    <script>
      const form = document.getElementById("loginForm");
      const message = document.getElementById("message");

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        const name = document.getElementById("name").value.trim();
        const birth = document.getElementById("birth").value.trim();

        const correctName = "장예진";
        const correctBirth = "001020";

        if (name === correctName && birth === correctBirth) {
          window.location.href = "./letter.html";
        } else {
          message.textContent = "누구신데요?! 이름과 생년월일을 다시 확인해 봐!";
        }
      });
    </script>
  </body>
</html>
